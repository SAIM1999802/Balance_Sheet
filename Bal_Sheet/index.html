<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Balance Sheet</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      body {
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 30px;
      }
      .container {
        width: 700px;
      }
      .sheet {
        background: #fff;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      th,
      td {
        border: 1px solid #999;
        padding: 10px;
        text-align: center;
      }
      th {
        background: #e8e8e8;
      }
      input {
        width: 100%;
        padding: 8px;
        border: 1px solid #999;
        border-radius: 4px;
        outline: none;
      }
      .button-box {
        display: flex;
        justify-content: flex-end;
        margin-top: 15px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.3s;
      }

      button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sheet">
        <h2>Balance Sheet</h2>

        <table>
          <tr>
            <th>Amount in $</th>
          </tr>
          <tr>
            <td>
              <form id="myForm">
                <input type="text" id="desc" placeholder="Enter Description" />
                <input
                  type="text"
                  id="input"
                  class="mt-3"
                  placeholder="Enter amount"
                />
                <button type="submit" class="mt-4 btn-success" id="btn">Submit</button>
                <button type="button" class="ms-3 mt-4 btn-danger" id="btn2">Clear</button>
                <button type="button" class="ms-3 mt-4 btn-secondary" id="btn3">Export</button>
                <button type="button" class="ms-3 mt-4 btn-info" id="importBtn">Import</button>
                <input
                  type="file"
                  id="importFile"
                  accept=".xlsx,.xls"
                  style="display: none;"
                />
              </form>

             
            </td>
          </tr>
        </table>
      </div>
      <table id="tab" class="table table-striped table-hover">
        <thead>
          <th>Description</th>
          <th>Debit</th>
          <th>Credit</th>
          <th>Total Amount in $</th>
        </thead>

      </table>
    </div>
  </body>
  <script src="./jquery-4.0.0.min.js"></script>
  <script src="./app.js" defer></script>
  <!-- use version 0.20.3 -->
  <script
    type="text/javascript"
    src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
  ></script>
</html>
